<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="nc_glow_cyan" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nc_glow_blue" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="nc_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="nc_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0369A1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="nc_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1440" height="900" fill="#030712"/>
  <rect width="1440" height="900" fill="url(#nc_glow_cyan)"/>
  <rect width="1440" height="900" fill="url(#nc_glow_blue)"/>

  <!-- Cyber Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="0.5">
    <line x1="0" y1="180" x2="1440" y2="180"/>
    <line x1="0" y1="360" x2="1440" y2="360"/>
    <line x1="0" y1="540" x2="1440" y2="540"/>
    <line x1="0" y1="720" x2="1440" y2="720"/>
    <line x1="288" y1="0" x2="288" y2="900"/>
    <line x1="576" y1="0" x2="576" y2="900"/>
    <line x1="864" y1="0" x2="864" y2="900"/>
    <line x1="1152" y1="0" x2="1152" y2="900"/>
  </g>

  <!-- Laptop / Studio Display Frame -->
  <g transform="translate(180, 110)">
    <rect x="20" y="30" width="1040" height="640" rx="18" fill="#00F0FF" opacity="0.2" filter="url(#nc_blur)"/>
    <rect x="0" y="0" width="1080" height="680" rx="16" fill="url(#nc_card_bg)" stroke="url(#nc_border)" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="1080" height="48" rx="16" fill="#0B1A30" fill-opacity="0.9"/>
    <circle cx="28" cy="24" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="46" cy="24" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="64" cy="24" r="5" fill="#10B981" opacity="0.8"/>
    <text x="540" y="29" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">NEURA-CORE // SPATIAL INTELLIGENCE LAB</text>

    <!-- Canvas Inner Content -->
    <g transform="translate(80, 90)">
      <!-- Left side copy -->
      <text x="0" y="60" fill="#38BDF8" font-family="'Inter', monospace" font-size="12" font-weight="600" letter-spacing="4">SYSTEM // QUANTUM CORE v4.8</text>
      <text x="0" y="125" fill="#FFFFFF" font-family="'Syne', 'Inter', sans-serif" font-size="48" font-weight="800" letter-spacing="1">SYNAPSE</text>
      <text x="0" y="180" fill="#00F0FF" font-family="'Bodoni MT', 'Didot', serif" font-size="52" font-style="italic">Architecture</text>
      <text x="0" y="235" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14" font-weight="300" max-width="360">
        <tspan x="0" dy="0">Real-time neural synthesis and spatial computing.</tspan>
        <tspan x="0" dy="24">Engineered for autonomous cognitive visualization.</tspan>
      </text>

      <!-- CTA Button -->
      <g transform="translate(0, 300)">
        <rect width="180" height="44" rx="22" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.2"/>
        <text x="90" y="27" fill="#00F0FF" font-family="'Inter', monospace" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle">INITIALIZE MATRIX</text>
      </g>

      <!-- Center-Right 3D Geometric Neural Lattice Visual -->
      <g transform="translate(540, 40)">
        <!-- Outer Glowing Rings -->
        <circle cx="190" cy="190" r="170" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="6 8" opacity="0.4"/>
        <circle cx="190" cy="190" r="130" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>
        <circle cx="190" cy="190" r="90" fill="#00F0FF" fill-opacity="0.08" stroke="#00F0FF" stroke-width="2"/>

        <!-- Core Sphere with Gradient -->
        <circle cx="190" cy="190" r="60" fill="url(#nc_glow_cyan)"/>
        
        <!-- Crosshairs & Orbit Lines -->
        <line x1="20" y1="190" x2="360" y2="190" stroke="#00F0FF" stroke-width="0.8" opacity="0.5"/>
        <line x1="190" y1="20" x2="190" y2="360" stroke="#00F0FF" stroke-width="0.8" opacity="0.5"/>
        
        <!-- Dynamic Waveforms & Metrics -->
        <path d="M 90 290 Q 140 250, 190 280 T 290 270" fill="none" stroke="#38BDF8" stroke-width="2"/>
        <text x="190" y="335" fill="#38BDF8" font-family="'Inter', monospace" font-size="10" letter-spacing="3" text-anchor="middle">LATENCY: 0.12ms // 100% COHERENCE</text>
      </g>
    </g>

    <!-- Bottom Telemetry strip -->
    <g transform="translate(40, 620)">
      <line x1="0" y1="0" x2="1000" y2="0" stroke="#00F0FF" stroke-width="0.5" opacity="0.3"/>
      <text x="0" y="25" fill="#64748B" font-family="'Inter', monospace" font-size="10" letter-spacing="2">NODE: TOKYO // BERLIN // SF</text>
      <text x="1000" y="25" fill="#00F0FF" font-family="'Inter', monospace" font-size="10" letter-spacing="2" text-anchor="end">LIVE STREAM: ACTIVE</text>
    </g>
  </g>
</svg>
