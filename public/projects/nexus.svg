<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="nx_amb_emerald" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#022c22" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020806" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nx_amb_cyan" cx="80%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#083344" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="nx_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081410"/>
      <stop offset="100%" stop-color="#030806"/>
    </linearGradient>
    <linearGradient id="nx_border_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#064E3B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="nx_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#030706"/>
  <rect width="1440" height="900" fill="url(#nx_amb_emerald)"/>
  <rect width="1440" height="900" fill="url(#nx_amb_cyan)"/>

  <!-- Stand & Monitor Shadow -->
  <g transform="translate(180, 110)">
    <rect x="20" y="30" width="1040" height="640" rx="18" fill="#059669" opacity="0.22" filter="url(#nx_glow)"/>
    <rect x="0" y="0" width="1080" height="680" rx="16" fill="url(#nx_card_bg)" stroke="url(#nx_border_glow)" stroke-width="1.5"/>

    <!-- Top Window Bar -->
    <rect x="0" y="0" width="1080" height="48" rx="16" fill="#0B1A14" fill-opacity="0.9"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10B981" opacity="0.8"/>
    <text x="540" y="28" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3" text-anchor="middle" opacity="0.7">NEXUS LABS // NEURAL SPATIAL MATRIX</text>

    <!-- Canvas Inner Content -->
    <g transform="translate(60, 90)">
      <!-- Left Editorial Copy -->
      <text x="0" y="70" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="4">SPATIAL AI &amp; BIOMETRICS</text>
      <text x="0" y="150" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">SYNAPSE</text>
      <text x="0" y="220" fill="#10B981" font-family="'Bodoni MT', 'Didot', Georgia, serif" font-size="64" font-weight="400" font-style="italic">Neural Synthesis</text>
      <text x="0" y="275" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="15" font-weight="300" max-width="400">Autonomous multi-agent intelligence operating with real-time biometric telemetry and spatial graph visualization.</text>

      <!-- CTA Button -->
      <rect x="0" y="330" width="190" height="46" rx="23" fill="#10B981"/>
      <text x="95" y="358" fill="#022C22" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">INITIALIZE LABS →</text>

      <!-- 3D Geometric Ring Visual (Right) -->
      <g transform="translate(620, 160)">
        <circle cx="140" cy="120" r="130" stroke="#10B981" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
        <circle cx="140" cy="120" r="90" stroke="#06B6D4" stroke-width="3" opacity="0.8"/>
        <ellipse cx="140" cy="120" rx="140" ry="50" stroke="#34D399" stroke-width="1.5" transform="rotate(-30 140 120)" opacity="0.7"/>
        <ellipse cx="140" cy="120" rx="140" ry="50" stroke="#67E8F9" stroke-width="1.5" transform="rotate(30 140 120)" opacity="0.7"/>
        <circle cx="140" cy="120" r="24" fill="#10B981" filter="url(#nx_glow)"/>
        <circle cx="140" cy="120" r="14" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Monitor Stand Base -->
    <path d="M 440 680 L 480 730 L 600 730 L 640 680 Z" fill="#0B1A14" opacity="0.85"/>
  </g>
</svg>
