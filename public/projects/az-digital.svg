<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="az_amb_amber" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#7C2D12" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050302" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="az_warm_spot" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="az_body_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E1A"/>
      <stop offset="50%" stop-color="#140F0D"/>
      <stop offset="100%" stop-color="#0D0908"/>
    </linearGradient>
    <linearGradient id="az_accent_line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="az_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1440" height="900" fill="#070403"/>
  <rect width="1440" height="900" fill="url(#az_amb_amber)"/>
  <rect width="1440" height="900" fill="url(#az_warm_spot)"/>

  <!-- Laptop Mockup Presentation -->
  <g transform="translate(200, 100)">
    <!-- Ambient Shadow -->
    <ellipse cx="520" cy="670" rx="460" ry="24" fill="#000000" opacity="0.85" filter="url(#az_glow)"/>

    <!-- Screen Lid Bezel -->
    <rect x="70" y="20" width="900" height="570" rx="18" fill="#120D0A" stroke="#44322A" stroke-width="1.5"/>
    <circle cx="520" cy="38" r="3" fill="#2E241E"/>

    <!-- Inner Screen Display -->
    <rect x="88" y="52" width="864" height="524" rx="6" fill="#0B0705"/>

    <!-- Editorial Website Layout on Screen -->
    <g transform="translate(124, 76)">
      <!-- Top nav inside mockup -->
      <g opacity="0.85">
        <text x="0" y="24" fill="#FFFFFF" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" letter-spacing="3">AZ // VENTURES</text>
        <text x="560" y="24" fill="#D6D3D1" font-family="-apple-system, sans-serif" font-size="10" letter-spacing="2">THESIS</text>
        <text x="640" y="24" fill="#D6D3D1" font-family="-apple-system, sans-serif" font-size="10" letter-spacing="2">PORTFOLIO</text>
        <text x="736" y="24" fill="#F97316" font-family="-apple-system, sans-serif" font-size="10" letter-spacing="2">CONTACT</text>
      </g>
      <line x1="0" y1="42" x2="792" y2="42" stroke="#291F1A" stroke-width="1"/>

      <!-- Editorial Hero Headline -->
      <text x="0" y="110" fill="#F97316" font-family="'Bodoni MT', 'Didot', Georgia, serif" font-size="44" font-weight="400" font-style="italic">The Architecture of</text>
      <text x="0" y="170" fill="#FFFFFF" font-family="'Cinzel', Georgia, serif" font-size="54" font-weight="800" letter-spacing="2">DIGITAL VENTURES</text>

      <line x1="0" y1="200" x2="160" y2="200" stroke="url(#az_accent_line)" stroke-width="2"/>

      <text x="0" y="235" fill="#A8A29E" font-family="-apple-system, sans-serif" font-size="12" font-weight="300" letter-spacing="0.5">Capital, engineering, and cinematic brand acceleration for iconic ventures.</text>

      <!-- Editorial Columns / Cards -->
      <g transform="translate(0, 270)">
        <!-- Card 1 -->
        <rect x="0" y="0" width="240" height="190" rx="6" fill="#17100C" stroke="#382922" stroke-width="1"/>
        <rect x="16" y="16" width="208" height="100" rx="4" fill="#241712"/>
        <text x="28" y="74" fill="#F59E0B" font-family="Georgia, serif" font-size="28" font-weight="700">01</text>
        <text x="16" y="142" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SYNDICATE ALPHA</text>
        <text x="16" y="162" fill="#78716C" font-family="-apple-system, sans-serif" font-size="10">Deep Tech Seed Fund</text>

        <!-- Card 2 -->
        <rect x="264" y="0" width="240" height="190" rx="6" fill="#17100C" stroke="#382922" stroke-width="1"/>
        <rect x="280" y="16" width="208" height="100" rx="4" fill="#2A1A12"/>
        <text x="292" y="74" fill="#EA580C" font-family="Georgia, serif" font-size="28" font-weight="700">02</text>
        <text x="280" y="142" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">NEURAL STUDIO</text>
        <text x="280" y="162" fill="#78716C" font-family="-apple-system, sans-serif" font-size="10">Autonomous Brand Systems</text>

        <!-- Card 3 -->
        <rect x="528" y="0" width="240" height="190" rx="6" fill="#17100C" stroke="#382922" stroke-width="1"/>
        <rect x="544" y="16" width="208" height="100" rx="4" fill="#321D14"/>
        <text x="556" y="74" fill="#FB923C" font-family="Georgia, serif" font-size="28" font-weight="700">03</text>
        <text x="544" y="142" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">VENTURE LABS</text>
        <text x="544" y="162" fill="#78716C" font-family="-apple-system, sans-serif" font-size="10">Incubation &amp; Scale</text>
      </g>
    </g>

    <!-- Laptop Base & Keyboard Well -->
    <path d="M 0 590 L 1040 590 L 980 618 L 60 618 Z" fill="#1C1512" stroke="#3D2D25" stroke-width="1"/>
    <!-- Trackpad notch -->
    <rect x="470" y="590" width="100" height="6" rx="3" fill="#33241C"/>
    <!-- Under-lip highlight -->
    <line x1="60" y1="618" x2="980" y2="618" stroke="#5A4337" stroke-width="1"/>
  </g>
</svg>
