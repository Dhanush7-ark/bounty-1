<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="ch_amb_purple" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#7E22CE" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3B0764" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#040206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ch_amb_violet" cx="80%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#581C87" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="ch_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120A1A"/>
      <stop offset="100%" stop-color="#07030C"/>
    </linearGradient>
    <linearGradient id="ch_border_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#6B21A8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="ch_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#040207"/>
  <rect width="1440" height="900" fill="url(#ch_amb_purple)"/>
  <rect width="1440" height="900" fill="url(#ch_amb_violet)"/>

  <!-- Stand & Monitor Shadow -->
  <g transform="translate(180, 110)">
    <rect x="20" y="30" width="1040" height="640" rx="18" fill="#7E22CE" opacity="0.22" filter="url(#ch_glow)"/>
    <rect x="0" y="0" width="1080" height="680" rx="16" fill="url(#ch_card_bg)" stroke="url(#ch_border_glow)" stroke-width="1.5"/>

    <!-- Top Window Bar -->
    <rect x="0" y="0" width="1080" height="48" rx="16" fill="#180E24" fill-opacity="0.9"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10B981" opacity="0.8"/>
    <text x="540" y="28" fill="#E9D5FF" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3" text-anchor="middle" opacity="0.7">CHATONE ECOSYSTEM // ENCRYPTED MESSAGING</text>

    <!-- Canvas Inner Content -->
    <g transform="translate(60, 90)">
      <text x="0" y="70" fill="#E9D5FF" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="4">MOBILE SECURE PLATFORM</text>
      <text x="0" y="150" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">CHATONE</text>
      <text x="0" y="220" fill="#C084FC" font-family="'Bodoni MT', 'Didot', Georgia, serif" font-size="64" font-weight="400" font-style="italic">Fluid Signals</text>
      <text x="0" y="275" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="15" font-weight="300" max-width="400">Zero-knowledge encrypted protocol, tactile haptics, dynamic voice waveforms, and real-time biometric identity.</text>

      <!-- CTA Button -->
      <rect x="0" y="330" width="190" height="46" rx="23" fill="#A855F7"/>
      <text x="95" y="358" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">LAUNCH APP →</text>

      <!-- Smartphone Preview Frame on Right -->
      <g transform="translate(680, 40)">
        <rect x="0" y="0" width="220" height="430" rx="36" fill="#0D0714" stroke="#A855F7" stroke-width="2"/>
        <rect x="8" y="8" width="204" height="414" rx="28" fill="#07030C"/>
        <!-- Dynamic Island -->
        <rect x="75" y="16" width="70" height="18" rx="9" fill="#000000"/>
        <!-- Chat bubbles -->
        <rect x="20" y="60" width="140" height="42" rx="14" fill="#9333EA"/>
        <text x="32" y="86" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Encrypted handshake...</text>
        <rect x="50" y="115" width="134" height="42" rx="14" fill="#2E1065" stroke="#7E22CE" stroke-width="1"/>
        <text x="62" y="141" fill="#D8B4FE" font-family="'Inter', sans-serif" font-size="11">Verified key exchange ✓</text>
        <!-- Waveform Pill -->
        <rect x="20" y="170" width="164" height="50" rx="25" fill="#7E22CE" opacity="0.6"/>
        <path d="M 40 195 L 48 190 L 56 200 L 64 185 L 72 205 L 80 192 L 88 198 L 96 188 L 104 202 L 112 195" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <!-- Monitor Stand Base -->
    <path d="M 440 680 L 480 730 L 600 730 L 640 680 Z" fill="#180E24" opacity="0.85"/>
  </g>
</svg>