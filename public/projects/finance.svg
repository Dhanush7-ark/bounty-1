<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <!-- Warm amber & sunlight gradients -->
    <radialGradient id="fn_warm_sun" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#78350F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080503" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fn_desk_surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E140F"/>
      <stop offset="60%" stop-color="#120B08"/>
      <stop offset="100%" stop-color="#0A0604"/>
    </linearGradient>
    <linearGradient id="fn_phone_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="fn_chart_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="fn_soft_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1440" height="900" fill="#0A0705"/>
  <rect width="1440" height="900" fill="url(#fn_warm_sun)"/>

  <!-- Lifestyle Scene Environment -->
  <!-- Desk mat / Leather surface -->
  <rect x="120" y="80" width="1200" height="740" rx="24" fill="url(#fn_desk_surface)" stroke="#2B1A13" stroke-width="1"/>

  <!-- Moleskine Notebook on right -->
  <g transform="translate(940, 200) rotate(6)">
    <rect x="0" y="0" width="220" height="320" rx="12" fill="#1C1410" stroke="#3D2920" stroke-width="1.5"/>
    <!-- Bookmark ribbon -->
    <path d="M 110 0 L 110 350 L 120 335 L 130 350 L 130 0 Z" fill="#D97706" opacity="0.8"/>
    <!-- Ruled paper inside hint -->
    <rect x="18" y="24" width="184" height="272" rx="4" fill="#0D0907"/>
    <line x1="36" y1="60" x2="184" y2="60" stroke="#362218" stroke-width="1"/>
    <line x1="36" y1="84" x2="184" y2="84" stroke="#362218" stroke-width="1"/>
    <line x1="36" y1="108" x2="184" y2="108" stroke="#362218" stroke-width="1"/>
    <line x1="36" y1="132" x2="140" y2="132" stroke="#362218" stroke-width="1"/>
  </g>

  <!-- Ceramic Coffee Mug on upper left -->
  <g transform="translate(240, 180)">
    <circle cx="60" cy="60" r="54" fill="#17110E" stroke="#3E2A21" stroke-width="2"/>
    <circle cx="60" cy="60" r="44" fill="#2E1B12"/>
    <circle cx="60" cy="60" r="40" fill="#451A03"/>
    <!-- Coffee surface swirl -->
    <ellipse cx="60" cy="60" rx="36" ry="34" fill="#291206"/>
    <path d="M 45 55 Q 60 70 75 58" stroke="#D97706" stroke-width="1" opacity="0.4" fill="none"/>
    <!-- Mug handle -->
    <path d="M 114 42 Q 140 60 114 78" stroke="#3E2A21" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Metallic Pen on lower left -->
  <g transform="translate(220, 560) rotate(-22)">
    <rect x="0" y="0" width="180" height="8" rx="4" fill="#78350F" stroke="#F59E0B" stroke-width="0.8"/>
    <polygon points="180,0 200,4 180,8" fill="#FBBF24"/>
    <rect x="20" y="0" width="20" height="8" fill="#F59E0B"/>
  </g>

  <!-- Main Centered Presentation: Smartphone showcasing Finance App -->
  <g transform="translate(540, 90)">
    <!-- Shadow beneath phone -->
    <ellipse cx="180" cy="680" rx="220" ry="24" fill="#000000" opacity="0.9" filter="url(#fn_soft_shadow)"/>

    <!-- Phone chassis with warm gold metallic rim -->
    <rect x="0" y="0" width="360" height="710" rx="52" fill="#140D09" stroke="url(#fn_phone_rim)" stroke-width="2"/>

    <!-- Screen Bezel -->
    <rect x="12" y="12" width="336" height="686" rx="42" fill="#080504"/>

    <!-- Dynamic Island -->
    <rect x="126" y="24" width="108" height="28" rx="14" fill="#000000"/>

    <!-- Finance App Content -->
    <g transform="translate(32, 70)">
      <!-- Top app bar -->
      <g>
        <text x="0" y="22" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="11" letter-spacing="1">TOTAL ASSETS</text>
        <text x="0" y="56" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">$2,849,150</text>
        
        <rect x="220" y="32" width="76" height="26" rx="13" fill="#064E3B" stroke="#059669" stroke-width="1"/>
        <text x="258" y="49" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+14.8%</text>
      </g>

      <!-- Interactive Chart Area -->
      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="296" height="180" rx="16" fill="#140E0A" stroke="#2B1A12" stroke-width="1"/>
        
        <!-- Gradient fill beneath curve -->
        <path d="M 16 140 Q 60 120 100 130 T 180 80 T 250 50 L 280 40 L 280 160 L 16 160 Z" fill="url(#fn_chart_grad)"/>
        
        <!-- Bright Green Neon Chart Line -->
        <path d="M 16 140 Q 60 120 100 130 T 180 80 T 250 50 L 280 40" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Active Tooltip Pin -->
        <circle cx="250" cy="50" r="5" fill="#34D399"/>
        <circle cx="250" cy="50" r="10" stroke="#34D399" stroke-width="1" opacity="0.5"/>

        <!-- Timeframe selector -->
        <g transform="translate(16, 146)" font-family="-apple-system, sans-serif" font-size="10" fill="#78716C">
          <text x="0" y="14">1D</text>
          <text x="52" y="14">1W</text>
          <text x="104" y="14" fill="#F59E0B" font-weight="700">1M</text>
          <text x="156" y="14">1Y</text>
          <text x="210" y="14">ALL</text>
        </g>
      </g>

      <!-- Quick Action Pills -->
      <g transform="translate(0, 290)">
        <rect x="0" y="0" width="90" height="40" rx="10" fill="#24140D" stroke="#451A03" stroke-width="1"/>
        <text x="45" y="24" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TRANSFER</text>

        <rect x="103" y="0" width="90" height="40" rx="10" fill="#24140D" stroke="#451A03" stroke-width="1"/>
        <text x="148" y="24" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">INVEST</text>

        <rect x="206" y="0" width="90" height="40" rx="10" fill="#24140D" stroke="#451A03" stroke-width="1"/>
        <text x="251" y="24" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CARDS</text>
      </g>

      <!-- Portfolio Breakdown List -->
      <g transform="translate(0, 350)">
        <text x="0" y="0" fill="#9CA3AF" font-family="-apple-system, sans-serif" font-size="10" letter-spacing="1">ALLOCATION</text>

        <!-- Item 1 -->
        <g transform="translate(0, 16)">
          <rect x="0" y="0" width="296" height="56" rx="12" fill="#140E0A" stroke="#2B1A12" stroke-width="1"/>
          <circle cx="28" cy="28" r="16" fill="#F59E0B" fill-opacity="0.2"/>
          <text x="28" y="32" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ETH</text>
          <text x="56" y="26" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Ethereum Treasury</text>
          <text x="56" y="42" fill="#78716C" font-family="-apple-system, sans-serif" font-size="10">842.50 ETH</text>
          <text x="280" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="end">$1,920,400</text>
        </g>

        <!-- Item 2 -->
        <g transform="translate(0, 80)">
          <rect x="0" y="0" width="296" height="56" rx="12" fill="#140E0A" stroke="#2B1A12" stroke-width="1"/>
          <circle cx="28" cy="28" r="16" fill="#10B981" fill-opacity="0.2"/>
          <text x="28" y="32" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">USD</text>
          <text x="56" y="26" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Yield Liquid Vault</text>
          <text x="56" y="42" fill="#78716C" font-family="-apple-system, sans-serif" font-size="10">4.85% APY</text>
          <text x="280" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="end">$928,750</text>
        </g>
      </g>
    </g>
  </g>
</svg>
