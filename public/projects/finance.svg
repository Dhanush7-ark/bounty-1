<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="fn_amb_amber" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#451A03" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#080301" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fn_amb_gold" cx="80%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#78350F" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="fn_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140C04"/>
      <stop offset="100%" stop-color="#080401"/>
    </linearGradient>
    <linearGradient id="fn_border_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="fn_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#060301"/>
  <rect width="1440" height="900" fill="url(#fn_amb_amber)"/>
  <rect width="1440" height="900" fill="url(#fn_amb_gold)"/>

  <!-- Stand & Monitor Shadow -->
  <g transform="translate(180, 110)">
    <rect x="20" y="30" width="1040" height="640" rx="18" fill="#D97706" opacity="0.22" filter="url(#fn_glow)"/>
    <rect x="0" y="0" width="1080" height="680" rx="16" fill="url(#fn_card_bg)" stroke="url(#fn_border_glow)" stroke-width="1.5"/>

    <!-- Top Window Bar -->
    <rect x="0" y="0" width="1080" height="48" rx="16" fill="#1A1006" fill-opacity="0.9"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10B981" opacity="0.8"/>
    <text x="540" y="28" fill="#FDE68A" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3" text-anchor="middle" opacity="0.7">FINANCE ATELIER // ASSET TELEMETRY</text>

    <!-- Canvas Inner Content -->
    <g transform="translate(60, 90)">
      <text x="0" y="70" fill="#FDE68A" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="4">LIFESTYLE FINTECH SYSTEM</text>
      <text x="0" y="150" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">FINANCE</text>
      <text x="0" y="220" fill="#F59E0B" font-family="'Bodoni MT', 'Didot', Georgia, serif" font-size="64" font-weight="400" font-style="italic">Asset Velocity</text>
      <text x="0" y="275" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="15" font-weight="300" max-width="400">High-frequency visualizers, curated portfolio balance analytics, luxury leather workspace environments, and ledger telemetry.</text>

      <!-- CTA Button -->
      <rect x="0" y="330" width="190" height="46" rx="23" fill="#F59E0B"/>
      <text x="95" y="358" fill="#451A03" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">VIEW PORTFOLIO →</text>

      <!-- Smartphone Preview Frame on Right -->
      <g transform="translate(680, 40)">
        <rect x="0" y="0" width="220" height="430" rx="36" fill="#140C04" stroke="#F59E0B" stroke-width="2"/>
        <rect x="8" y="8" width="204" height="414" rx="28" fill="#0A0602"/>
        <!-- Dynamic Island -->
        <rect x="75" y="16" width="70" height="18" rx="9" fill="#000000"/>
        <!-- Balance Card -->
        <rect x="20" y="55" width="164" height="110" rx="16" fill="#1A1006" stroke="#D97706" stroke-width="1"/>
        <text x="35" y="85" fill="#D97706" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">TOTAL VALUE</text>
        <text x="35" y="125" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="24" font-weight="900">$2,849,150</text>
        <!-- Chart Graph Line -->
        <path d="M 35 150 C 60 142, 90 120, 120 135 C 145 145, 160 110, 175 105" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <!-- Asset Row -->
        <rect x="20" y="180" width="164" height="46" rx="12" fill="#120A03"/>
        <circle cx="44" cy="203" r="12" fill="#F59E0B"/>
        <text x="68" y="207" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Ethereum Staking</text>
      </g>
    </g>

    <!-- Monitor Stand Base -->
    <path d="M 440 680 L 480 730 L 600 730 L 640 680 Z" fill="#1A1006" opacity="0.85"/>
  </g>
</svg>