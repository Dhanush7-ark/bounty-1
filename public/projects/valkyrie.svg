<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="vk_amb_red" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#450A0A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050101" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vk_amb_amber" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#7C2D12" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="vk_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A0A"/>
      <stop offset="100%" stop-color="#080303"/>
    </linearGradient>
    <linearGradient id="vk_border_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#7F1D1D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="vk_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#040101"/>
  <rect width="1440" height="900" fill="url(#vk_amb_red)"/>
  <rect width="1440" height="900" fill="url(#vk_amb_amber)"/>

  <!-- Stand & Monitor Shadow -->
  <g transform="translate(180, 110)">
    <rect x="20" y="30" width="1040" height="640" rx="18" fill="#DC2626" opacity="0.2" filter="url(#vk_glow)"/>
    <rect x="0" y="0" width="1080" height="680" rx="16" fill="url(#vk_card_bg)" stroke="url(#vk_border_glow)" stroke-width="1.5"/>

    <!-- Top Window Bar -->
    <rect x="0" y="0" width="1080" height="48" rx="16" fill="#1C0F0F" fill-opacity="0.9"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10B981" opacity="0.8"/>
    <text x="540" y="28" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3" text-anchor="middle" opacity="0.7">VALKYRIE HYPERSPORT // AERODYNAMICS</text>

    <!-- Canvas Inner Content -->
    <g transform="translate(60, 90)">
      <text x="0" y="70" fill="#FCA5A5" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="4">BESPOKE HYPERCAR MONOGRAPH</text>
      <text x="0" y="150" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">VALKYRIE</text>
      <text x="0" y="220" fill="#EF4444" font-family="'Bodoni MT', 'Didot', Georgia, serif" font-size="64" font-weight="400" font-style="italic">Mach Velocity</text>
      <text x="0" y="275" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="15" font-weight="300" max-width="400">Carbon-composite architecture, active aero flow dynamics, and precision track telemetry engineered in matte obsidian.</text>

      <!-- CTA Button -->
      <rect x="0" y="330" width="190" height="46" rx="23" fill="#EF4444"/>
      <text x="95" y="358" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">VIEW CONFIGURATOR →</text>

      <!-- Aerodynamic Silhouette Streamline (Right) -->
      <g transform="translate(560, 150)">
        <path d="M 0 160 C 90 140, 180 80, 280 80 C 340 80, 400 120, 480 140" stroke="#EF4444" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
        <path d="M 40 180 C 130 160, 210 110, 300 110 C 370 110, 420 150, 490 170" stroke="#F97316" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
        <path d="M 80 200 C 170 180, 240 140, 320 140 C 390 140, 430 170, 500 190" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 4" fill="none" opacity="0.5"/>
        <!-- Speed vector point -->
        <circle cx="480" cy="140" r="7" fill="#EF4444" filter="url(#vk_glow)"/>
        <circle cx="480" cy="140" r="3" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Monitor Stand Base -->
    <path d="M 440 680 L 480 730 L 600 730 L 640 680 Z" fill="#1C0F0F" opacity="0.85"/>
  </g>
</svg>