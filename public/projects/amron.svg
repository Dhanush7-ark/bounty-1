<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="am_amb_crimson" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#450A0A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050202" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="am_orange_streak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="am_red_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="am_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1440" height="900" fill="#050303"/>
  <rect width="1440" height="900" fill="url(#am_amb_crimson)"/>

  <!-- Vertical Orange Light Streak near Left Edge (Master Prompt requirement) -->
  <line x1="80" y1="100" x2="80" y2="800" stroke="url(#am_orange_streak)" stroke-width="2.5" opacity="0.8" filter="url(#am_glow)"/>
  <line x1="80" y1="200" x2="80" y2="700" stroke="#FFEDD5" stroke-width="0.8" opacity="0.9"/>

  <!-- Center Presentation: High-End Studio Monitor Display -->
  <g transform="translate(220, 100)">
    <!-- Shadow -->
    <ellipse cx="500" cy="650" rx="420" ry="24" fill="#000000" opacity="0.9" filter="url(#am_glow)"/>

    <!-- Display Frame -->
    <rect x="50" y="20" width="900" height="560" rx="14" fill="#0C0A0A" stroke="#2B1D1D" stroke-width="1.5"/>

    <!-- Screen Bezel -->
    <rect x="66" y="36" width="868" height="528" rx="6" fill="#050404"/>

    <!-- AMRON Visual Interior -->
    <g transform="translate(100, 60)">
      <!-- Top header bar -->
      <text x="0" y="30" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3">AMRON // INDUSTRIAL AESTHETICS</text>
      <text x="730" y="30" fill="#78716C" font-family="-apple-system, sans-serif" font-size="10" letter-spacing="2">ARCHIVE 2024</text>
      <line x1="0" y1="46" x2="800" y2="46" stroke="#261717" stroke-width="1"/>

      <!-- Center Title -->
      <g transform="translate(0, 80)">
        <text x="0" y="56" fill="#FFFFFF" font-family="'Syne', -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">AMRON</text>
        <text x="0" y="96" fill="#F87171" font-family="-apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="4">SPATIAL MOTION &amp; BRAND DYNAMICS</text>
      </g>

      <!-- Center Red/Orange Graphic: Monolithic 3D Wireframe Form -->
      <g transform="translate(420, 70)">
        <polygon points="180,20 340,110 340,310 180,400 20,310 20,110" fill="#1C0909" stroke="#DC2626" stroke-width="1.5"/>
        <polygon points="180,20 340,110 180,200 20,110" fill="#2E0E0E" stroke="#EF4444" stroke-width="1"/>
        <polygon points="180,200 340,110 340,310 180,400" fill="#160606" stroke="#B91C1C" stroke-width="1"/>
        <polygon points="180,200 20,110 20,310 180,400" fill="#0E0404" stroke="#7F1D1D" stroke-width="1"/>
        <!-- Inner orange energy core -->
        <circle cx="180" cy="200" r="40" fill="#F97316" fill-opacity="0.3" filter="url(#am_glow)"/>
        <circle cx="180" cy="200" r="15" fill="#FEF08A"/>
      </g>

      <!-- Left Data Readouts -->
      <g transform="translate(0, 220)">
        <rect x="0" y="0" width="360" height="90" rx="8" fill="#140808" stroke="#371717" stroke-width="1"/>
        <text x="20" y="32" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="10" letter-spacing="2">CORE PRINCIPLE</text>
        <text x="20" y="60" fill="#FFFFFF" font-family="Georgia, serif" font-size="15" font-style="italic">"Uncompromising form through kinetic discipline."</text>

        <rect x="0" y="105" width="360" height="90" rx="8" fill="#140808" stroke="#371717" stroke-width="1"/>
        <text x="20" y="137" fill="#FCA5A5" font-family="-apple-system, sans-serif" font-size="10" letter-spacing="2">OUTPUT CAPABILITY</text>
        <text x="20" y="165" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Real-time Procedural Art Direction</text>
      </g>
    </g>

    <!-- Monitor Stand -->
    <rect x="440" y="580" width="120" height="50" fill="#1A1414" stroke="#2B1D1D" stroke-width="1"/>
    <rect x="360" y="626" width="280" height="12" rx="6" fill="#120E0E" stroke="#3D2929" stroke-width="1"/>
  </g>
</svg>
