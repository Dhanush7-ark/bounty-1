<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="kn_amb_gold" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#451A03" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#080301" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kn_amb_amber" cx="80%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#78350F" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="kn_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140C04"/>
      <stop offset="100%" stop-color="#080401"/>
    </linearGradient>
    <linearGradient id="kn_border_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="kn_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#060301"/>
  <rect width="1440" height="900" fill="url(#kn_amb_gold)"/>
  <rect width="1440" height="900" fill="url(#kn_amb_amber)"/>

  <!-- Stand & Monitor Shadow -->
  <g transform="translate(180, 110)">
    <rect x="20" y="30" width="1040" height="640" rx="18" fill="#D97706" opacity="0.22" filter="url(#kn_glow)"/>
    <rect x="0" y="0" width="1080" height="680" rx="16" fill="url(#kn_card_bg)" stroke="url(#kn_border_glow)" stroke-width="1.5"/>

    <!-- Top Window Bar -->
    <rect x="0" y="0" width="1080" height="48" rx="16" fill="#1A1006" fill-opacity="0.9"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10B981" opacity="0.8"/>
    <text x="540" y="28" fill="#FDE68A" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3" text-anchor="middle" opacity="0.7">KINETIC ATELIER // PARAMETRIC MORPHOLOGY</text>

    <!-- Canvas Inner Content -->
    <g transform="translate(60, 90)">
      <text x="0" y="70" fill="#FDE68A" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="4">PARAMETRIC SPATIAL DESIGN</text>
      <text x="0" y="150" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">KINETIC</text>
      <text x="0" y="220" fill="#F59E0B" font-family="'Bodoni MT', 'Didot', Georgia, serif" font-size="64" font-weight="400" font-style="italic">Molten Form</text>
      <text x="0" y="275" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="15" font-weight="300" max-width="400">Generative kinetic facades, molten bronze sculptural structures, and real-time solar responsive geometry.</text>

      <!-- CTA Button -->
      <rect x="0" y="330" width="190" height="46" rx="23" fill="#F59E0B"/>
      <text x="95" y="358" fill="#451A03" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">EXPLORE MONOLITH →</text>

      <!-- 3D Parametric Wireframe Facet (Right) -->
      <g transform="translate(600, 130)">
        <polygon points="120,30 220,110 180,230 60,230 20,110" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.8"/>
        <polygon points="120,70 190,125 160,200 80,200 50,125" stroke="#D97706" stroke-width="1.5" fill="none" opacity="0.6"/>
        <line x1="120" y1="30" x2="120" y2="70" stroke="#FCD34D" stroke-width="1.5" opacity="0.8"/>
        <line x1="220" y1="110" x2="190" y2="125" stroke="#FCD34D" stroke-width="1.5" opacity="0.8"/>
        <line x1="180" y1="230" x2="160" y2="200" stroke="#FCD34D" stroke-width="1.5" opacity="0.8"/>
        <line x1="60" y1="230" x2="80" y2="200" stroke="#FCD34D" stroke-width="1.5" opacity="0.8"/>
        <line x1="20" y1="110" x2="50" y2="125" stroke="#FCD34D" stroke-width="1.5" opacity="0.8"/>
        <circle cx="120" cy="140" r="14" fill="#F59E0B" filter="url(#kn_glow)"/>
        <circle cx="120" cy="140" r="6" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Monitor Stand Base -->
    <path d="M 440 680 L 480 730 L 600 730 L 640 680 Z" fill="#1A1006" opacity="0.85"/>
  </g>
</svg>