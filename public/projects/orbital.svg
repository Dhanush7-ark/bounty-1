<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="ob_amb_violet" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#311068" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#04020A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ob_amb_blue" cx="80%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="ob_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100A1C"/>
      <stop offset="100%" stop-color="#06030D"/>
    </linearGradient>
    <linearGradient id="ob_border_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="ob_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#04020A"/>
  <rect width="1440" height="900" fill="url(#ob_amb_violet)"/>
  <rect width="1440" height="900" fill="url(#ob_amb_blue)"/>

  <!-- Stand & Monitor Shadow -->
  <g transform="translate(180, 110)">
    <rect x="20" y="30" width="1040" height="640" rx="18" fill="#7C3AED" opacity="0.2" filter="url(#ob_glow)"/>
    <rect x="0" y="0" width="1080" height="680" rx="16" fill="url(#ob_card_bg)" stroke="url(#ob_border_glow)" stroke-width="1.5"/>

    <!-- Top Window Bar -->
    <rect x="0" y="0" width="1080" height="48" rx="16" fill="#171126" fill-opacity="0.9"/>
    <circle cx="28" cy="24" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10B981" opacity="0.8"/>
    <text x="540" y="28" fill="#DDD6FE" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3" text-anchor="middle" opacity="0.7">ORBITAL SOUND // BINAURAL ACOUSTICS</text>

    <!-- Canvas Inner Content -->
    <g transform="translate(60, 90)">
      <text x="0" y="70" fill="#C4B5FD" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="4">SPATIAL SOUND ARCHITECTURE</text>
      <text x="0" y="150" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">ORBITAL</text>
      <text x="0" y="220" fill="#A78BFA" font-family="'Bodoni MT', 'Didot', Georgia, serif" font-size="64" font-weight="400" font-style="italic">Sonic Resonance</text>
      <text x="0" y="275" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="15" font-weight="300" max-width="400">Object-based binaural soundscapes, spherical harmonic synthesis, and ultra-low-latency spatial rendering for virtual worlds.</text>

      <!-- CTA Button -->
      <rect x="0" y="330" width="190" height="46" rx="23" fill="#8B5CF6"/>
      <text x="95" y="358" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">LISTEN IN SPATIAL →</text>

      <!-- Concentric Soundwave Ripples (Right) -->
      <g transform="translate(640, 160)">
        <circle cx="120" cy="120" r="140" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3"/>
        <circle cx="120" cy="120" r="105" stroke="#A78BFA" stroke-width="2" opacity="0.5"/>
        <circle cx="120" cy="120" r="70" stroke="#3B82F6" stroke-width="2.5" opacity="0.7"/>
        <circle cx="120" cy="120" r="35" stroke="#C084FC" stroke-width="3" opacity="0.85"/>
        <circle cx="120" cy="120" r="12" fill="#8B5CF6" filter="url(#ob_glow)"/>
        <circle cx="120" cy="120" r="6" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Monitor Stand Base -->
    <path d="M 440 680 L 480 730 L 600 730 L 640 680 Z" fill="#171126" opacity="0.85"/>
  </g>
</svg>