<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="vs_glow_magenta" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#701A75" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#070208" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vs_glow_purple" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="vs_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190A1C"/>
      <stop offset="100%" stop-color="#080209"/>
    </linearGradient>
    <linearGradient id="vs_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#581C87" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="vs_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1440" height="900" fill="#060208"/>
  <rect width="1440" height="900" fill="url(#vs_glow_magenta)"/>
  <rect width="1440" height="900" fill="url(#vs_glow_purple)"/>

  <!-- Creative Grid -->
  <g opacity="0.07" stroke="#E879F9" stroke-width="0.5">
    <line x1="0" y1="180" x2="1440" y2="180"/>
    <line x1="0" y1="360" x2="1440" y2="360"/>
    <line x1="0" y1="540" x2="1440" y2="540"/>
    <line x1="0" y1="720" x2="1440" y2="720"/>
    <line x1="288" y1="0" x2="288" y2="900"/>
    <line x1="576" y1="0" x2="576" y2="900"/>
    <line x1="864" y1="0" x2="864" y2="900"/>
    <line x1="1152" y1="0" x2="1152" y2="900"/>
  </g>

  <!-- Monitor / Cinema Atelier Frame -->
  <g transform="translate(180, 110)">
    <rect x="20" y="30" width="1040" height="640" rx="18" fill="#D946EF" opacity="0.22" filter="url(#vs_blur)"/>
    <rect x="0" y="0" width="1080" height="680" rx="16" fill="url(#vs_card_bg)" stroke="url(#vs_border)" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="1080" height="48" rx="16" fill="#240B28" fill-opacity="0.9"/>
    <circle cx="28" cy="24" r="5" fill="#D946EF" opacity="0.9"/>
    <circle cx="46" cy="24" r="5" fill="#A855F7" opacity="0.7"/>
    <circle cx="64" cy="24" r="5" fill="#E879F9" opacity="0.5"/>
    <text x="540" y="29" fill="#E879F9" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">VORTEX-STUDIOS // CINEMATIC CG ATELIER</text>

    <!-- Inner Content -->
    <g transform="translate(80, 90)">
      <text x="0" y="60" fill="#E879F9" font-family="'Inter', monospace" font-size="12" font-weight="600" letter-spacing="4">FEATURE // PHOTOREAL BRAND WORLD</text>
      <text x="0" y="125" fill="#FFFFFF" font-family="'Syne', 'Inter', sans-serif" font-size="48" font-weight="800" letter-spacing="1">CINEMA</text>
      <text x="0" y="180" fill="#D946EF" font-family="'Bodoni MT', 'Didot', serif" font-size="52" font-style="italic">Unreal Engine</text>
      <text x="0" y="235" fill="#F0ABFC" font-family="'Inter', sans-serif" font-size="14" font-weight="300" opacity="0.8">
        <tspan x="0" dy="0">High-fidelity 3D brand environments and interactive storytelling.</tspan>
        <tspan x="0" dy="24">Volumetric ray-tracing and cinematic lighting workflows.</tspan>
      </text>

      <!-- CTA Button -->
      <g transform="translate(0, 300)">
        <rect width="180" height="44" rx="22" fill="#D946EF" fill-opacity="0.15" stroke="#D946EF" stroke-width="1.2"/>
        <text x="90" y="27" fill="#E879F9" font-family="'Inter', monospace" font-size="11" font-weight="600" letter-spacing="2" text-anchor="middle">WATCH SHOWREEL</text>
      </g>

      <!-- Center-Right 3D Iridescent Liquid Chrome Sphere Visual -->
      <g transform="translate(540, 40)">
        <circle cx="190" cy="190" r="160" fill="url(#vs_glow_magenta)" opacity="0.4"/>
        <circle cx="190" cy="190" r="110" fill="#0A030D" stroke="#D946EF" stroke-width="2"/>
        
        <!-- Iridescent Metallic Curves -->
        <path d="M 120 160 C 150 110, 230 110, 260 160 C 290 210, 210 270, 160 250 C 120 230, 100 190, 120 160 Z" fill="url(#vs_glow_purple)" opacity="0.8"/>
        <path d="M 140 170 C 160 130, 220 130, 240 170 C 260 210, 200 250, 160 230" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
        <circle cx="170" cy="150" r="14" fill="#FFFFFF" opacity="0.3" filter="url(#vs_blur)"/>
        
        <text x="190" y="335" fill="#E879F9" font-family="'Inter', monospace" font-size="10" letter-spacing="3" text-anchor="middle">RENDER: UNREAL 5.5 // 8K 60FPS</text>
      </g>
    </g>

    <!-- Bottom Telemetry strip -->
    <g transform="translate(40, 620)">
      <line x1="0" y1="0" x2="1000" y2="0" stroke="#D946EF" stroke-width="0.5" opacity="0.3"/>
      <text x="0" y="25" fill="#701A75" font-family="'Inter', monospace" font-size="10" letter-spacing="2">LUMEN GI // NANITE MESH GEOMETRY</text>
      <text x="1000" y="25" fill="#E879F9" font-family="'Inter', monospace" font-size="10" letter-spacing="2" text-anchor="end">EXPERIENCE: IMMERSIVE 3D</text>
    </g>
  </g>
</svg>

